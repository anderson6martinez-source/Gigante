name: Compilar Gigante

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore Gigante.csproj

      - name: Compilar DLL
        run: dotnet build Gigante.csproj --configuration Release --no-restore

      - name: Guardar DLL
        uses: actions/upload-artifact@v4
        with:
          name: Gigante-DLL
          path: bin/Release/net10.0/Gigante.dll
